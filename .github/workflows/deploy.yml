name: Deploy to VPS

on:
  push:
    branches: [main-63nl54]
  # So a PR (Dependabot's dependency bumps included) runs the e2e suite and
  # shows green/red before anyone merges it, instead of only finding out
  # after the merge triggers a real deploy.
  pull_request:
    branches: [main-63nl54]

# Two deploys were landing close together (e.g. two commits pushed at once)
# and running their "deploy" jobs concurrently — their pre-deploy backups
# collided on the same same-minute filename, and overlapping file-copy +
# restart steps against the same VPS is its own latent risk. Serialize
# deploys instead of letting pushes race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e test suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup database before deploying
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -f /opt/planning-app/data/planning.db ]; then
              sqlite3 /opt/planning-app/data/planning.db "VACUUM INTO '/opt/planning-app/data/backups/avant-deploiement-$(date +%Y-%m-%d_%Hh%Mm%Ss).db'" \
                || echo "Pre-deploy backup failed or was skipped (non-fatal — the scheduled backups and avant-restauration-* snapshots still apply) — continuing with the deploy."
            else
              echo "No existing database yet (first deploy) — skipping pre-deploy backup."
            fi

      - name: Copy public/index.html
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "public/index.html"
          target: "/opt/planning-app/public"
          strip_components: 1

      # server.js's own require()s reach into lib/ (e.g. lib/legacyImport.js)
      # and package.json/package-lock.json name its npm dependencies — all
      # three need to land on the VPS alongside server.js, not just the one
      # file, or a require() for anything added after the initial deploy
      # fails at startup with the service already stopped (see the "Install
      # dependencies" step below for why an npm dependency needs the same
      # treatment).
      - name: Copy server.js, lib/ and package files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server.js,lib,package.json,package-lock.json"
          target: "/opt/planning-app"

      # Every deploy, not just ones that touch package.json: a prior deploy
      # could have shipped a server.js that already requires a new
      # dependency while this step didn't exist yet, so "only run npm ci
      # when the lockfile changed" can't catch it retroactively. `npm ci` on
      # an already-up-to-date node_modules is a quick no-op.
      - name: Install dependencies on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /opt/planning-app && npm ci --omit=dev

      - name: Restart planning-app service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: systemctl restart planning-app
