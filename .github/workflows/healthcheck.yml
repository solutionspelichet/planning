name: Health check (Telegram alerts)

# GitHub's cron scheduler is best-effort — during high platform load a run
# can land several minutes late, or very rarely be skipped. Fine for "alert
# me the app went down", not a substitute for a real uptime SLA.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Caches are immutable once written, so restore by prefix (whatever
      # the last run saved) and always save under a fresh key (this run's
      # id) — the standard pattern for small state that needs to persist
      # across scheduled runs.
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: healthcheck-state.json
          key: healthcheck-state-${{ github.run_id }}
          restore-keys: |
            healthcheck-state-

      - name: Run health check
        env:
          HEALTHCHECK_URL: https://planning.pelichet.guedou.ch/api/health
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/healthcheck.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: healthcheck-state.json
          key: healthcheck-state-${{ github.run_id }}
